{% extends "base.html" %}

{% block content %}

<h2>
    Новый пароль
</h2>

{% if validlink %}

<form method="post">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Изменить пароль
    </button>

</form>

{% else %}

<p>
    Ссылка недействительна или устарела.
</p>

{% endif %}

{% endblock %}
